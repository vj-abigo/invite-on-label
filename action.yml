name: invite-on-label
description: Automatically invite users to your GitHub organization when an issue is labeled.
author: Abishek P.Y
branding:
  icon: anchor
  color: green

inputs:
  organization:
    description: Name of the organization to which you would like to invite contributors.
    required: true
  label:
    description: Name of the label that triggers the invitation.
    required: true
  repo-token:
    description: GitHub token for accessing the repository.
    required: true
  comment:
    description: Comment to be posted on the issue after sending the invitation.
    required: false
    default: Invitation sent for the GitHub Organization. Welcome to the community!
  existingMemberMessage:
    description: Message to display if the user is already a member of the organization.
    required: false
    default: You are already a member of our organization.

runs:
  using: node16
  main: dist/index.js
